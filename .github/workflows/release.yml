name: Release Build

on:
  workflow_dispatch: # 允许手动点击按钮触发
  push:
    tags:
      - 'v*.*.*'

permissions: write-all

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0

jobs:
  # 第一步：修改后的检查任务，现在它只是个摆设，会直接通过
  check_tag_version:
    name: Check Release Tag and package.json Version Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Skip Check
        run: |
          echo "Skipping version check for manual/custom build..."
          exit 0

  # 第二步：核心构建任务
  release:
    name: Release Build
    needs: [check_tag_version]
    strategy:
      fail-fast: false
      matrix:
        include:
          # 我们只需要 Linux 环境来生成 AppImage
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.91.0'
          targets: ${{ matrix.target }}

      - name: Install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf librsvg2-bin appimagetool

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false

      - name: Pnpm install and check
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Clash Verge Rev Build'
          releaseDraft: true
          tauriScript: pnpm
          # 关键修改：强制要求构建 appimage
          args: --target ${{ matrix.target }} --bundle appimage

      # 第三步：将生成的 AppImage 提取出来，防止 Release 步骤失败导致找不到文件
      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clash-Verge-AppImage
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
