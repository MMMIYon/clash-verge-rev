name: Release Build

on:
  workflow_dispatch: # 允许手动点击按钮触发
  push:
    tags:
      - 'v*.*.*'

permissions: write-all

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # 解决 Node.js 20 弃用警告

jobs:
  # 第一步：修改后的检查任务
  check_tag_version:
    name: Check Release Tag and package.json Version Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Skip Check
        run: |
          echo "Skipping version check for manual/custom build..."
          exit 0

  # 第二步：核心构建任务
  release:
    name: Release Build
    needs: [check_tag_version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.91.0'
          targets: ${{ matrix.target }}

      - name: Install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          # 移除了无法通过 apt 安装的 appimagetool，并保留 Tauri 必需的系统库
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libbuild-bus-curl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            patchelf

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Pnpm install and check
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Clash Verge Rev Build'
          releaseDraft: true
          tauriScript: pnpm
          # 关键修改：Tauri Action 会自动处理 AppImage 逻辑，无需手动安装工具
          args: --target ${{ matrix.target }} --bundle appimage

      # 第三步：将生成的 AppImage 提取出来
      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clash-Verge-AppImage
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
